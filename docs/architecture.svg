<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 730" role="img" aria-label="ResponsibleAIRegistry System Architecture">
  <defs>
    <pattern id="dotGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#D4D4D8" />
    </pattern>
  </defs>
  <rect x="0" y="0" width="1220" height="730" fill="#FFFFFF" />
  <rect x="0" y="0" width="1220" height="730" fill="url(#dotGrid)" opacity="0.68" />

  <!-- Layer 1 -->
  <rect x="24" y="18" width="1172" height="142" fill="#FAFAFA" stroke="#71717A" stroke-width="1.6" stroke-dasharray="8 6" />
  <text x="38" y="42" font-family="sans-serif" font-size="16" font-weight="800" fill="#6D28D9">1. Browser Console &amp; Serverless AWS Edge (CloudFront + Private S3 OAC + Python 3.12 Lambda)</text>

  <rect x="40" y="56" width="205" height="82" fill="#EDE9FE" stroke="#18181B" stroke-width="2" />
  <text x="142" y="86" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="800" fill="#18181B">Governance Studio UI</text>
  <text x="142" y="108" text-anchor="middle" font-family="monospace" font-size="10" fill="#4C1D95">4 Interactive Gates</text>
  <text x="142" y="124" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#3F3F46">URL hash state + Dark mode</text>

  <rect x="295" y="56" width="245" height="82" fill="#DBEAFE" stroke="#18181B" stroke-width="2" />
  <text x="417" y="86" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="800" fill="#18181B">Amazon CloudFront CDN</text>
  <text x="417" y="108" text-anchor="middle" font-family="monospace" font-size="10" fill="#1E3A8A">Single HTTPS Origin Router</text>
  <text x="417" y="124" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#3F3F46">/* -&gt; S3 OAC · /api/* -&gt; Lambda</text>

  <rect x="595" y="48" width="285" height="44" fill="#DCFCE7" stroke="#18181B" stroke-width="2" />
  <text x="737" y="68" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="800" fill="#18181B">Private Amazon S3 Bucket</text>
  <text x="737" y="83" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#065F46">BlockPublicAccess=true · OAC SigV4</text>

  <rect x="595" y="102" width="285" height="44" fill="#FEF3C7" stroke="#18181B" stroke-width="2" />
  <text x="737" y="122" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="800" fill="#18181B">AWS Lambda API (Python 3.12)</text>
  <text x="737" y="137" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#92400E">rai_registry/server.py · 512 MB</text>

  <rect x="915" y="48" width="260" height="98" fill="#FAF5FF" stroke="#18181B" stroke-width="2" />
  <text x="1045" y="74" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="800" fill="#6D28D9">$0.00 Idle Architecture</text>
  <text x="1045" y="96" text-anchor="middle" font-family="monospace" font-size="10" fill="#18181B">No EC2, RDS, or NAT Gateways</text>
  <text x="1045" y="116" text-anchor="middle" font-family="monospace" font-size="10" fill="#18181B">On-demand Nova Lite Converse</text>
  <text x="1045" y="134" text-anchor="middle" font-family="monospace" font-size="10" fill="#059669">Sub-ms deterministic gates</text>

  <!-- Layer 2 -->
  <rect x="24" y="186" width="1172" height="155" fill="#F5F3FF" stroke="#6D28D9" stroke-width="1.6" stroke-dasharray="8 6" />
  <text x="38" y="210" font-family="sans-serif" font-size="16" font-weight="800" fill="#6D28D9">2. Fleet Discovery &amp; Regulatory Conformance Plane (AST/IaC AI-BOM + EU AI Act / NIST AI RMF Gate)</text>

  <rect x="42" y="226" width="545" height="96" fill="#FFFFFF" stroke="#18181B" stroke-width="2" />
  <text x="314" y="254" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="800" fill="#18181B">Shadow-AI AST &amp; CloudFormation/CDK Scanner</text>
  <text x="314" y="276" text-anchor="middle" font-family="monospace" font-size="10" fill="#6D28D9">rai_registry/shadow_ai_bom.py · ast.NodeVisitor + IaC Inspector</text>
  <text x="314" y="298" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#3F3F46">Flags unregistered Bedrock/SageMaker/OpenAI calls, missing Guardrails &amp; S3 TTLs</text>

  <rect x="625" y="226" width="550" height="96" fill="#FFFFFF" stroke="#18181B" stroke-width="2" />
  <text x="900" y="254" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="800" fill="#18181B">EU AI Act &amp; NIST AI RMF Risk Classifier &amp; Release Gate</text>
  <text x="900" y="276" text-anchor="middle" font-family="monospace" font-size="10" fill="#92400E">rai_registry/risk_conformance.py · Prohibited / High / Transparency / Minimal</text>
  <text x="900" y="298" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#3F3F46">Builds Annex IV Model Cards + Art. 14 Human Oversight + PASS/BLOCK Release Verdicts</text>

  <!-- Layer 3 -->
  <rect x="24" y="368" width="1172" height="155" fill="#F0FDF4" stroke="#059669" stroke-width="1.6" stroke-dasharray="8 6" />
  <text x="38" y="392" font-family="sans-serif" font-size="16" font-weight="800" fill="#065F46">3. Statistical Subgroup Fairness &amp; Verified CS Knowledge Artifact Plane</text>

  <rect x="42" y="408" width="545" height="96" fill="#FFFFFF" stroke="#18181B" stroke-width="2" />
  <text x="314" y="436" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="800" fill="#18181B">Subgroup Fairness &amp; Threshold Mitigator</text>
  <text x="314" y="458" text-anchor="middle" font-family="monospace" font-size="10" fill="#065F46">rai_registry/fairness_metrics.py · 4/5ths DI + |dTPR| + |dFPR| + ECE</text>
  <text x="314" y="480" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#3F3F46">Optimizes per-cohort thresholds across 4,000 rows to restore 0.80 DI compliance</text>

  <rect x="625" y="408" width="550" height="96" fill="#FFFFFF" stroke="#18181B" stroke-width="2" />
  <text x="900" y="436" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="800" fill="#18181B">Write-Time SOP-to-Knowledge Artifact Distiller</text>
  <text x="900" y="458" text-anchor="middle" font-family="monospace" font-size="10" fill="#1E3A8A">rai_registry/sop_artifact_distiller.py · en-US / es-US / de-DE / ja-JP</text>
  <text x="900" y="480" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#3F3F46">Verifies 100% numeric/exception entailment &amp; blocks cross-locale policy conflicts</text>

  <!-- Layer 4 -->
  <rect x="42" y="556" width="545" height="145" fill="#EDE9FE" stroke="#18181B" stroke-width="2.2" />
  <text x="314" y="592" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="800" fill="#4C1D95">4. Amazon Bedrock Converse Foundation Model</text>
  <text x="314" y="618" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#18181B">us.amazon.nova-lite-v1:0 (us-west-2)</text>
  <text x="314" y="644" text-anchor="middle" font-family="monospace" font-size="10" fill="#4C1D95">Compiles SOP Knowledge Artifacts, risk rationales &amp; BOM fixes</text>
  <text x="314" y="672" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#6D28D9">Zero-false-negative safety lattice + numeric grounding verifier</text>

  <rect x="625" y="556" width="550" height="145" fill="#FEF3C7" stroke="#18181B" stroke-width="2.2" />
  <text x="900" y="592" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="800" fill="#92400E">4. Central SQLite WAL AI-BOM &amp; Hash-Chained Ledger</text>
  <text x="900" y="618" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#18181B">approved_ai_bom + conformance_events (SHA-256)</text>
  <text x="900" y="644" text-anchor="middle" font-family="monospace" font-size="10" fill="#78350F">Stores approved model/region baselines &amp; tamper-evident audit receipts</text>
  <text x="900" y="672" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#065F46">Chained from GENESIS_RAI_REGISTRY_SQLITE_0000</text>
</svg>
